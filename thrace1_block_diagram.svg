<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Helvetica, Arial, sans-serif">

  <!-- ══════════ DEFS ══════════ -->
  <defs>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- ══════════ BACKGROUND ══════════ -->
  <rect x="0" y="0" width="1500" height="960" fill="#0d1421"/>

  <!-- ══════════ TITLE ══════════ -->
  <text x="70" y="38" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">ThRACE-1 — SATELLITE ELECTRICAL BLOCK DIAGRAM</text>
  <text x="70" y="58" fill="#64748b" font-size="12">Rev A  ·  May 2026  ·  Bus: 2S Li-ion, 6.0–8.4V  ·  Connectors: JST-GH (signal) / MiniFit Jr (power)</text>

  <!-- ══════════ LEGEND ══════════ -->
  <g font-size="11">
    <rect x="1120" y="30" width="330" height="118" rx="6" fill="#111a2e" stroke="#1e3354"/>
    <text x="1135" y="50" fill="#94a3b8" font-size="10" letter-spacing="2">LEGEND</text>
    <line x1="1135" y1="66" x2="1180" y2="66" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="1190" y="70" fill="#cbd5e1">power (switched 2S / local rails)</text>
    <line x1="1135" y1="86" x2="1180" y2="86" stroke="#22d3ee" stroke-width="2"/>
    <text x="1190" y="90" fill="#cbd5e1">data (UART / I2C / SPI / GPIO)</text>
    <line x1="1135" y1="106" x2="1180" y2="106" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1190" y="110" fill="#cbd5e1">interface TBD (pending ICD)</text>
    <line x1="1135" y1="126" x2="1180" y2="126" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="1190" y="130" fill="#cbd5e1">RF</text>
  </g>

  <!-- ══════════ SOLAR PANELS ══════════ -->
  <g>
    <rect x="70" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="140" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">WING L (deploy)</text>
    <text x="140" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>

    <rect x="225" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="295" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">CENTER (fixed)</text>
    <text x="295" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>

    <rect x="380" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="450" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">WING R (deploy)</text>
    <text x="450" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>

    <line x1="140" y1="130" x2="160" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
    <line x1="295" y1="130" x2="295" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
    <line x1="450" y1="130" x2="430" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  </g>

  <!-- ══════════ EPS ══════════ -->
  <rect x="120" y="195" width="360" height="210" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="140" y="222" fill="#f59e0b" font-size="14" font-weight="bold">EPS — POWER MANAGEMENT</text>
  <text x="140" y="238" fill="#64748b" font-size="10">(custom or COTS — decision deferred)</text>
  <text x="140" y="262" fill="#cbd5e1" font-size="11">· MPPT per panel string</text>
  <text x="140" y="280" fill="#cbd5e1" font-size="11">· 2S charger + cell balancing + temp cutoff</text>
  <text x="140" y="298" fill="#cbd5e1" font-size="11">· Load switch + INA219 per output rail</text>
  <text x="140" y="316" fill="#cbd5e1" font-size="11">· Burn-wire drivers ×3 (OBC-commanded)</text>
  <text x="140" y="334" fill="#cbd5e1" font-size="11">· Battery heater driver (&lt; -10°C)</text>
  <text x="140" y="352" fill="#cbd5e1" font-size="11">· No regulators — all outputs raw switched bus</text>
  <text x="140" y="382" fill="#f59e0b" font-size="11" font-weight="bold">SWITCHED RAILS → OBC · ADCS · UHF · burn · heater</text>

  <!-- ══════════ BATTERY + RBF + DEPLOY SW ══════════ -->
  <rect x="70" y="470" width="170" height="70" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="155" y="496" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BATTERY</text>
  <text x="155" y="513" fill="#64748b" font-size="10" text-anchor="middle">2S Li-ion · ~7.4V nom</text>
  <text x="155" y="527" fill="#64748b" font-size="10" text-anchor="middle">thermistor + heater pad</text>

  <rect x="270" y="480" width="90" height="48" rx="6" fill="#1a1424" stroke="#ef4444" stroke-width="1.2"/>
  <text x="315" y="500" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">RBF PIN</text>
  <text x="315" y="515" fill="#64748b" font-size="9" text-anchor="middle">access port</text>

  <rect x="390" y="480" width="130" height="48" rx="6" fill="#1a1424" stroke="#ef4444" stroke-width="1.2"/>
  <text x="455" y="500" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">DEPLOY SW ×2</text>
  <text x="455" y="515" fill="#64748b" font-size="9" text-anchor="middle">rail plungers</text>

  <line x1="240" y1="504" x2="270" y2="504" stroke="#f59e0b" stroke-width="3"/>
  <line x1="360" y1="504" x2="390" y2="504" stroke="#f59e0b" stroke-width="3"/>
  <line x1="455" y1="480" x2="455" y2="405" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="248" y="552" fill="#64748b" font-size="10">series power interrupts — CDS requirement (dead in P-POD / on bench)</text>

  <!-- ══════════ BURN WIRES + HEATER ══════════ -->
  <rect x="70" y="590" width="210" height="78" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="175" y="612" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BURN WIRES ×3</text>
  <text x="175" y="630" fill="#64748b" font-size="10" text-anchor="middle">UHF antenna release</text>
  <text x="175" y="644" fill="#64748b" font-size="10" text-anchor="middle">wing L release · wing R release</text>
  <text x="175" y="658" fill="#64748b" font-size="10" text-anchor="middle">(fired ≥30 min post-eject)</text>

  <rect x="70" y="690" width="200" height="55" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="170" y="712" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BATTERY HEATER</text>
  <text x="170" y="729" fill="#64748b" font-size="10" text-anchor="middle">resistive pad on pack</text>

  <line x1="255" y1="405" x2="255" y2="570" stroke="#f59e0b" stroke-width="3"/>
  <line x1="255" y1="570" x2="175" y2="570" stroke="#f59e0b" stroke-width="3"/>
  <line x1="175" y1="570" x2="175" y2="590" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="255" y1="570" x2="255" y2="690" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>

  <!-- ══════════ OBC ══════════ -->
  <rect x="620" y="250" width="340" height="320" rx="8" fill="#16213a" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="640" y="278" fill="#22d3ee" font-size="14" font-weight="bold">OBC — MIXER V2 DERIVATIVE</text>
  <text x="640" y="294" fill="#64748b" font-size="10">(custom, KiCad)</text>
  <text x="640" y="318" fill="#cbd5e1" font-size="11">· STM32H743 @ ~240 MHz (thermal margin)</text>
  <text x="640" y="336" fill="#cbd5e1" font-size="11">· Local regulation: 2S → 5V → 3.3V (MPM3610)</text>
  <text x="640" y="354" fill="#cbd5e1" font-size="11">· 2× GD25Q32E datalog flash (write both)</text>
  <text x="640" y="372" fill="#cbd5e1" font-size="11">· RTC + VBAT supercap (survives reboots)</text>
  <text x="640" y="390" fill="#cbd5e1" font-size="11">· IWDG watchdog + FDIR + reboot recovery</text>
  <text x="640" y="408" fill="#cbd5e1" font-size="11">· Reset button (hold-at-boot clears state)</text>
  <text x="640" y="426" fill="#cbd5e1" font-size="11">· Pogo-pad SWD programming</text>
  <text x="640" y="444" fill="#cbd5e1" font-size="11">· Spare I2C / SPI / GPIO expansion headers</text>
  <text x="640" y="474" fill="#f59e0b" font-size="11" font-weight="bold">3.3V out → GNSS ×2 · LSM6DSO</text>
  <text x="640" y="492" fill="#f59e0b" font-size="11" font-weight="bold">5V out → Geiger HV · payload ADC</text>
  <text x="640" y="522" fill="#64748b" font-size="10">boot logic: deploy-switch state + saved state ⇒</text>
  <text x="640" y="536" fill="#64748b" font-size="10">first-boot-in-space detect, 30-min deploy/RF timers</text>

  <!-- EPS ↔ OBC -->
  <line x1="480" y1="300" x2="620" y2="300" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <text x="550" y="292" fill="#f59e0b" font-size="10" text-anchor="middle">switched 2S</text>
  <line x1="620" y1="370" x2="480" y2="370" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <line x1="480" y1="386" x2="620" y2="386" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="550" y="364" fill="#22d3ee" font-size="10" text-anchor="middle">rail-en GPIO + fire cmds</text>
  <text x="550" y="400" fill="#22d3ee" font-size="10" text-anchor="middle">I2C housekeeping</text>

  <!-- ══════════ POWER TRUNK TO ADCS / UHF ══════════ -->
  <polyline points="480,215 480,160 1180,160 1180,200" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <polyline points="1390,160 1390,415 1350,415" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <line x1="1180" y1="160" x2="1390" y2="160" stroke="#f59e0b" stroke-width="3.5"/>
  <text x="830" y="152" fill="#f59e0b" font-size="10">switched 2S rails (independent per unit — FDIR power-cycle)</text>

  <!-- ══════════ CUBEADCS ══════════ -->
  <rect x="1120" y="200" width="230" height="120" rx="8" fill="#16213a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1140" y="226" fill="#10b981" font-size="13" font-weight="bold">CubeSpace CubeADCS</text>
  <text x="1140" y="242" fill="#64748b" font-size="10">(COTS)</text>
  <text x="1140" y="262" fill="#cbd5e1" font-size="11">· RW + MTQ + sun sensors + IMU</text>
  <text x="1140" y="280" fill="#cbd5e1" font-size="11">· Interface: TBD — UART assumed</text>
  <text x="1140" y="298" fill="#f87171" font-size="11">· verify raw-IMU access (ICD, OBJ-7/8)</text>
  <line x1="960" y1="250" x2="1120" y2="250" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrCyan)"/>
  <text x="1040" y="242" fill="#22d3ee" font-size="10" text-anchor="middle">TBD</text>

  <!-- ══════════ UHF ══════════ -->
  <rect x="1120" y="360" width="230" height="110" rx="8" fill="#16213a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1140" y="386" fill="#10b981" font-size="13" font-weight="bold">Endurosat UHF Type II</text>
  <text x="1140" y="402" fill="#64748b" font-size="10">(COTS)</text>
  <text x="1140" y="422" fill="#cbd5e1" font-size="11">· 9.6 kbps AX.25 / CSP</text>
  <text x="1140" y="440" fill="#cbd5e1" font-size="11">· JST-GH UART (verify pinout — ICD)</text>
  <line x1="960" y1="400" x2="1120" y2="400" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="1040" y="392" fill="#22d3ee" font-size="10" text-anchor="middle">UART</text>

  <!-- turnstile antenna below UHF -->
  <polyline points="1290,470 1290,505" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrPurple)"/>
  <line x1="1270" y1="518" x2="1310" y2="518" stroke="#a78bfa" stroke-width="2"/>
  <line x1="1275" y1="510" x2="1305" y2="526" stroke="#a78bfa" stroke-width="2"/>
  <line x1="1275" y1="526" x2="1305" y2="510" stroke="#a78bfa" stroke-width="2"/>
  <text x="1290" y="546" fill="#a78bfa" font-size="10" text-anchor="middle">deployable turnstile</text>
  <text x="1290" y="559" fill="#64748b" font-size="9" text-anchor="middle">(burn-wire release)</text>

  <!-- ══════════ SKYTRAQ ══════════ -->
  <rect x="1120" y="590" width="230" height="92" rx="8" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="1140" y="614" fill="#e2e8f0" font-size="12" font-weight="bold">SkyTraq Venus838 GNSS</text>
  <text x="1140" y="630" fill="#64748b" font-size="10">space-rated · operational position</text>
  <text x="1140" y="648" fill="#cbd5e1" font-size="11">· pwr: OBC 3.3V</text>
  <text x="1140" y="666" fill="#cbd5e1" font-size="11">· external active patch antenna</text>
  <polyline points="960,540 1050,540 1050,616 1120,616" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="1000" y="532" fill="#22d3ee" font-size="10">UART</text>
  <polyline points="1350,630 1420,630" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrPurple)"/>
  <rect x="1424" y="618" width="24" height="24" rx="3" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="1436" y="660" fill="#a78bfa" font-size="9" text-anchor="middle">patch</text>

  <!-- ══════════ SAM-M10Q ══════════ -->
  <rect x="1120" y="712" width="230" height="86" rx="8" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="1140" y="736" fill="#e2e8f0" font-size="12" font-weight="bold">u-blox SAM-M10Q</text>
  <text x="1140" y="752" fill="#64748b" font-size="10">experiment — OBJ-9 (COCOM eval)</text>
  <text x="1140" y="770" fill="#cbd5e1" font-size="11">· integrated antenna (sky view)</text>
  <text x="1140" y="788" fill="#cbd5e1" font-size="11">· pwr: OBC 3.3V</text>
  <polyline points="940,570 940,624 1064,624 1064,752 1120,752" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="1000" y="616" fill="#22d3ee" font-size="10">I2C</text>

  <!-- ══════════ GEIGER VOLUME ══════════ -->
  <rect x="330" y="600" width="230" height="140" rx="8" fill="#160f1d" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="350" y="626" fill="#f87171" font-size="12" font-weight="bold">ISOLATED PAYLOAD VOLUME</text>
  <text x="350" y="648" fill="#cbd5e1" font-size="11">· Geiger-Müller tube (SBM-20 / J305)</text>
  <text x="350" y="666" fill="#cbd5e1" font-size="11">· 400V boost converter (from 5V)</text>
  <text x="350" y="684" fill="#cbd5e1" font-size="11">· pulse shaping → 3.3V logic out</text>
  <text x="350" y="708" fill="#64748b" font-size="10">short twisted HV wiring · kept away</text>
  <text x="350" y="722" fill="#64748b" font-size="10">from RF + digital buses (EMI)</text>

  <polyline points="390,600 390,580 640,580 640,570" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="505" y="574" fill="#22d3ee" font-size="10">pulse → GPIO IRQ</text>
  <polyline points="660,570 660,592 445,592 445,600" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="690" y="590" fill="#f59e0b" font-size="10">5V</text>

  <!-- ══════════ LSM6DSO ══════════ -->
  <rect x="620" y="650" width="175" height="70" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="707" y="674" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">LSM6DSO breakout</text>
  <text x="707" y="691" fill="#64748b" font-size="10" text-anchor="middle">test IMU — OBJ-8</text>
  <text x="707" y="705" fill="#64748b" font-size="10" text-anchor="middle">bracket-mount · soldered leads</text>
  <line x1="707" y1="570" x2="707" y2="650" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="720" y="616" fill="#22d3ee" font-size="10">I2C + 3.3V</text>

  <!-- ══════════ PAYLOAD SENSE BOARD ══════════ -->
  <rect x="830" y="640" width="290" height="150" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="850" y="666" fill="#f59e0b" font-size="13" font-weight="bold">PAYLOAD SENSE BOARD</text>
  <text x="850" y="682" fill="#64748b" font-size="10">(custom — aggregates face sensors)</text>
  <text x="850" y="704" fill="#cbd5e1" font-size="11">· ADC — photodiodes + irradiance</text>
  <text x="850" y="722" fill="#cbd5e1" font-size="11">· 6× MAX31865 RTD interface</text>
  <text x="850" y="740" fill="#cbd5e1" font-size="11">· digitize close to source (analog short)</text>
  <text x="850" y="762" fill="#64748b" font-size="10">one ribbon to OBC replaces 13 sensor runs</text>
  <line x1="900" y1="570" x2="900" y2="640" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="838" y="612" fill="#22d3ee" font-size="10">SPI + 7×CS</text>

  <!-- sensor fan-out -->
  <rect x="790" y="840" width="175" height="56" rx="6" fill="#111a2e" stroke="#1e3354"/>
  <text x="877" y="862" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">6× PHOTODIODE</text>
  <text x="877" y="878" fill="#64748b" font-size="10" text-anchor="middle">one per face — incl. radiator</text>

  <rect x="985" y="840" width="160" height="56" rx="6" fill="#111a2e" stroke="#1e3354"/>
  <text x="1065" y="862" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">6× PT1000 RTD</text>
  <text x="1065" y="878" fill="#64748b" font-size="10" text-anchor="middle">one per face</text>

  <rect x="1165" y="840" width="150" height="56" rx="6" fill="#111a2e" stroke="#1e3354"/>
  <text x="1240" y="862" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">IRRADIANCE</text>
  <text x="1240" y="878" fill="#64748b" font-size="10" text-anchor="middle">sun-face flux</text>

  <line x1="877" y1="790" x2="877" y2="840" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <polyline points="1000,790 1000,815 1065,815 1065,840" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <polyline points="1100,790 1100,815 1240,815 1240,840" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- ══════════ FOOTNOTES ══════════ -->
  <text x="70" y="800" fill="#64748b" font-size="10">OPEN ITEMS (ICD reads): ① CubeADCS raw-IMU access  ② CubeADCS control interface + input V range  ③ CubeADCS sun-sensor config</text>
  <text x="70" y="816" fill="#64748b" font-size="10">④ UHF Type II input V range  ⑤ UHF JST-GH pinout  ·  DEFERRED DECISIONS: EPS make-vs-buy · SD card on OBC · USB on OBC</text>
  <text x="70" y="848" fill="#334155" font-size="10">ThRACE-1-EBD-001 · derived from Mixer V2 architecture · all signal connectors JST-GH · power MiniFit Jr</text>
</svg>
