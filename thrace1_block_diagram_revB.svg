<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#0d1421"/>

  <text x="70" y="38" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">ThRACE-1 — SATELLITE ELECTRICAL BLOCK DIAGRAM</text>
  <text x="70" y="58" fill="#64748b" font-size="12">Rev B  ·  July 2026  ·  Bus: 2S Li-ion 6.0–8.4V  ·  OBC: STM32H753 (Mixer V2-derived)  ·  Signal: JST-GH / Power: MiniFit Jr</text>

  <!-- LEGEND -->
  <g font-size="11">
    <rect x="1120" y="30" width="330" height="118" rx="6" fill="#111a2e" stroke="#1e3354"/>
    <text x="1135" y="50" fill="#94a3b8" font-size="10" letter-spacing="2">LEGEND</text>
    <line x1="1135" y1="66" x2="1180" y2="66" stroke="#f59e0b" stroke-width="3.5"/><text x="1190" y="70" fill="#cbd5e1">power (switched 2S / local rails)</text>
    <line x1="1135" y1="86" x2="1180" y2="86" stroke="#22d3ee" stroke-width="2"/><text x="1190" y="90" fill="#cbd5e1">data (UART / I2C / SPI / GPIO)</text>
    <line x1="1135" y1="106" x2="1180" y2="106" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/><text x="1190" y="110" fill="#cbd5e1">interface TBD (pending ICD)</text>
    <line x1="1135" y1="126" x2="1180" y2="126" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4"/><text x="1190" y="130" fill="#cbd5e1">RF</text>
  </g>

  <!-- SOLAR PANELS -->
  <g>
    <rect x="70" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="140" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">WING L (deploy)</text>
    <text x="140" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>
    <rect x="225" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="295" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">CENTER (fixed)</text>
    <text x="295" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>
    <rect x="380" y="78" width="140" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
    <text x="450" y="99" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">WING R (deploy)</text>
    <text x="450" y="116" fill="#64748b" font-size="10" text-anchor="middle">GaAs 10×20cm</text>
    <line x1="140" y1="130" x2="160" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
    <line x1="295" y1="130" x2="295" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
    <line x1="450" y1="130" x2="430" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  </g>

  <!-- EPS -->
  <rect x="120" y="195" width="360" height="200" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="140" y="222" fill="#f59e0b" font-size="14" font-weight="bold">EPS — POWER MANAGEMENT (custom)</text>
  <text x="140" y="246" fill="#cbd5e1" font-size="11">· MPPT per panel string</text>
  <text x="140" y="264" fill="#cbd5e1" font-size="11">· 2S charger + balancing + temp cutoff</text>
  <text x="140" y="282" fill="#cbd5e1" font-size="11">· Load switch + INA219 per output rail</text>
  <text x="140" y="300" fill="#cbd5e1" font-size="11">· Burn-wire drivers ×3 (OBC-commanded)</text>
  <text x="140" y="318" fill="#cbd5e1" font-size="11">· Battery heater driver (&lt; -10°C)</text>
  <text x="140" y="336" fill="#cbd5e1" font-size="11">· No regulators — outputs raw switched bus</text>
  <text x="140" y="366" fill="#f59e0b" font-size="11" font-weight="bold">SWITCHED 2S → OBC · ADCS · UHF · burn · heater</text>

  <!-- BATTERY + RBF + DEPLOY -->
  <rect x="70" y="460" width="170" height="70" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="155" y="486" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BATTERY</text>
  <text x="155" y="503" fill="#64748b" font-size="10" text-anchor="middle">2S Li-ion · ~7.4V nom</text>
  <text x="155" y="517" fill="#64748b" font-size="10" text-anchor="middle">thermistor + heater pad</text>

  <rect x="270" y="470" width="90" height="48" rx="6" fill="#1a1424" stroke="#ef4444" stroke-width="1.2"/>
  <text x="315" y="490" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">RBF PIN</text>
  <text x="315" y="505" fill="#64748b" font-size="9" text-anchor="middle">access port</text>
  <rect x="390" y="470" width="130" height="48" rx="6" fill="#1a1424" stroke="#ef4444" stroke-width="1.2"/>
  <text x="455" y="490" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">DEPLOY SW ×2</text>
  <text x="455" y="505" fill="#64748b" font-size="9" text-anchor="middle">rail plungers</text>

  <line x1="240" y1="494" x2="270" y2="494" stroke="#f59e0b" stroke-width="3"/>
  <line x1="360" y1="494" x2="390" y2="494" stroke="#f59e0b" stroke-width="3"/>
  <line x1="455" y1="470" x2="455" y2="395" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="230" y="543" fill="#64748b" font-size="10">series power interrupts — CDS requirement (dead in P-POD / on bench)</text>

  <!-- BURN + HEATER -->
  <rect x="70" y="580" width="210" height="76" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="175" y="602" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BURN WIRES ×3</text>
  <text x="175" y="620" fill="#64748b" font-size="10" text-anchor="middle">UHF antenna · wing L · wing R</text>
  <text x="175" y="634" fill="#64748b" font-size="10" text-anchor="middle">spring + burn wire release</text>
  <text x="175" y="648" fill="#64748b" font-size="10" text-anchor="middle">(fired ≥30 min post-eject)</text>

  <rect x="70" y="676" width="200" height="52" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="170" y="698" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BATTERY HEATER</text>
  <text x="170" y="715" fill="#64748b" font-size="10" text-anchor="middle">resistive pad on pack</text>

  <line x1="255" y1="395" x2="255" y2="560" stroke="#f59e0b" stroke-width="3"/>
  <line x1="255" y1="560" x2="175" y2="560" stroke="#f59e0b" stroke-width="3"/>
  <line x1="175" y1="560" x2="175" y2="580" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="255" y1="560" x2="255" y2="676" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>

  <!-- OBC -->
  <rect x="600" y="240" width="360" height="300" rx="8" fill="#16213a" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="620" y="267" fill="#22d3ee" font-size="14" font-weight="bold">OBC — STM32H753 (custom)</text>
  <text x="620" y="283" fill="#64748b" font-size="10">Mixer V2-derived · central sled above ADCS</text>
  <text x="620" y="307" fill="#cbd5e1" font-size="11">· STM32H753 @ ~240 MHz (thermal margin)</text>
  <text x="620" y="325" fill="#cbd5e1" font-size="11">· Local reg: 2S→5V + 2S→3.3V (2× MPM3610)</text>
  <text x="620" y="343" fill="#cbd5e1" font-size="11">· 2× GD25Q32E datalog flash</text>
  <text x="620" y="361" fill="#cbd5e1" font-size="11">· 6× MAX31865 on-board (RTD interfaces)</text>
  <text x="620" y="379" fill="#cbd5e1" font-size="11">· RTC + supercap · USB-C prog/data/bench pwr</text>
  <text x="620" y="397" fill="#cbd5e1" font-size="11">· HW crypto (uplink auth) · IWDG + FDIR</text>
  <text x="620" y="415" fill="#cbd5e1" font-size="11">· Reset + BOOT0 buttons · spare I2C/SPI/GPIO</text>
  <text x="620" y="439" fill="#f59e0b" font-size="11" font-weight="bold">3.3V → GNSS×2 · IMU · irradiance · flash</text>
  <text x="620" y="457" fill="#f59e0b" font-size="11" font-weight="bold">5V → Geiger HV boost</text>
  <text x="620" y="487" fill="#64748b" font-size="10">boot: deploy-switch + saved-state ⇒ first-boot</text>
  <text x="620" y="501" fill="#64748b" font-size="10">detect · 30-min deploy/RF inhibit timers</text>
  <text x="620" y="521" fill="#64748b" font-size="10">USB VBUS sense → bench-safe mode (no deploy/TX)</text>

  <!-- EPS <-> OBC -->
  <line x1="480" y1="290" x2="600" y2="290" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <text x="540" y="282" fill="#f59e0b" font-size="10" text-anchor="middle">switched 2S</text>
  <line x1="600" y1="345" x2="480" y2="345" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <line x1="480" y1="361" x2="600" y2="361" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="540" y="339" fill="#22d3ee" font-size="10" text-anchor="middle">rail-en + fire cmds</text>
  <text x="540" y="375" fill="#22d3ee" font-size="10" text-anchor="middle">I2C housekeeping</text>

  <!-- POWER TRUNK to ADCS / UHF -->
  <polyline points="480,215 480,155 1180,155 1180,195" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <line x1="1180" y1="155" x2="1400" y2="155" stroke="#f59e0b" stroke-width="3.5"/>
  <polyline points="1400,155 1400,405 1360,405" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <text x="820" y="147" fill="#f59e0b" font-size="10">switched 2S — independent per unit (FDIR power-cycle)</text>

  <!-- CUBEADCS -->
  <rect x="1120" y="195" width="240" height="130" rx="8" fill="#16213a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1140" y="221" fill="#10b981" font-size="13" font-weight="bold">CubeSpace CubeADCS</text>
  <text x="1140" y="237" fill="#64748b" font-size="10">(COTS · ~½U, no star tracker)</text>
  <text x="1140" y="257" fill="#cbd5e1" font-size="11">· RW + MTQ + sun sensors + IMU</text>
  <text x="1140" y="275" fill="#cbd5e1" font-size="11">· provides sun sensing (no photodiodes)</text>
  <text x="1140" y="293" fill="#cbd5e1" font-size="11">· interface: TBD — UART assumed</text>
  <text x="1140" y="311" fill="#f87171" font-size="11">· verify raw-IMU access (OBJ-7/8)</text>
  <line x1="960" y1="255" x2="1120" y2="255" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrCyan)"/>
  <text x="1040" y="247" fill="#22d3ee" font-size="10" text-anchor="middle">TBD</text>

  <!-- UHF -->
  <rect x="1120" y="360" width="240" height="110" rx="8" fill="#16213a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1140" y="386" fill="#10b981" font-size="13" font-weight="bold">Endurosat UHF Type II</text>
  <text x="1140" y="402" fill="#64748b" font-size="10">(COTS · transceiver — TX + RX)</text>
  <text x="1140" y="422" fill="#cbd5e1" font-size="11">· 9.6 kbps AX.25 / CSP</text>
  <text x="1140" y="440" fill="#cbd5e1" font-size="11">· bidirectional UART (RX = uplink)</text>
  <text x="1140" y="458" fill="#cbd5e1" font-size="11">· JST-GH (verify pinout — ICD)</text>
  <line x1="960" y1="410" x2="1120" y2="410" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <line x1="1120" y1="425" x2="960" y2="425" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="1040" y="402" fill="#22d3ee" font-size="10" text-anchor="middle">UART TX/RX</text>

  <polyline points="1290,470 1290,505" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrPurple)"/>
  <line x1="1270" y1="518" x2="1310" y2="518" stroke="#a78bfa" stroke-width="2"/>
  <line x1="1275" y1="510" x2="1305" y2="526" stroke="#a78bfa" stroke-width="2"/>
  <line x1="1275" y1="526" x2="1305" y2="510" stroke="#a78bfa" stroke-width="2"/>
  <text x="1290" y="546" fill="#a78bfa" font-size="10" text-anchor="middle">deployable turnstile</text>

  <!-- SKYTRAQ -->
  <rect x="1120" y="590" width="240" height="88" rx="8" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="1140" y="614" fill="#e2e8f0" font-size="12" font-weight="bold">SkyTraq Venus838 GNSS</text>
  <text x="1140" y="630" fill="#64748b" font-size="10">space-rated · operational position</text>
  <text x="1140" y="648" fill="#cbd5e1" font-size="11">· UART · pwr OBC 3.3V</text>
  <text x="1140" y="666" fill="#cbd5e1" font-size="11">· external active patch antenna</text>
  <polyline points="960,470 1040,470 1040,616 1120,616" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="990" y="462" fill="#22d3ee" font-size="10">UART</text>
  <polyline points="1360,632 1420,632" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrPurple)"/>
  <rect x="1424" y="620" width="22" height="22" rx="3" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="1435" y="660" fill="#a78bfa" font-size="9" text-anchor="middle">patch</text>

  <!-- SAM-M10Q -->
  <rect x="1120" y="708" width="240" height="88" rx="8" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="1140" y="732" fill="#e2e8f0" font-size="12" font-weight="bold">u-blox SAM-M10Q</text>
  <text x="1140" y="748" fill="#64748b" font-size="10">experiment — OBJ-9 (COCOM eval)</text>
  <text x="1140" y="768" fill="#cbd5e1" font-size="11">· I2C · pwr OBC 3.3V</text>
  <text x="1140" y="786" fill="#cbd5e1" font-size="11">· integrated antenna (sky view)</text>
  <polyline points="945,540 945,620 1060,620 1060,752 1120,752" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="985" y="612" fill="#22d3ee" font-size="10">I2C</text>

  <!-- GEIGER VOLUME -->
  <rect x="330" y="590" width="230" height="130" rx="8" fill="#160f1d" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="350" y="616" fill="#f87171" font-size="12" font-weight="bold">ISOLATED GEIGER VOLUME</text>
  <text x="350" y="637" fill="#cbd5e1" font-size="11">· 1× G-M tube (J305 ~65mm)</text>
  <text x="350" y="655" fill="#cbd5e1" font-size="11">· 400V boost module (from 5V)</text>
  <text x="350" y="673" fill="#cbd5e1" font-size="11">· pulse shaping → 3.3V logic</text>
  <text x="350" y="697" fill="#64748b" font-size="10">at radiator end · away from RF + digital</text>
  <text x="350" y="711" fill="#64748b" font-size="10">short twisted HV wiring</text>

  <polyline points="390,590 390,570 600,570 600,540" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="500" y="564" fill="#22d3ee" font-size="10">pulse → GPIO IRQ</text>
  <polyline points="620,540 620,562 445,562 445,590" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="650" y="560" fill="#f59e0b" font-size="10">5V</text>

  <!-- LSM6DSO -->
  <rect x="600" y="650" width="165" height="66" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="682" y="674" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">LSM6DSO IMU</text>
  <text x="682" y="691" fill="#64748b" font-size="10" text-anchor="middle">test IMU — OBJ-8</text>
  <text x="682" y="705" fill="#64748b" font-size="10" text-anchor="middle">bracket-mount · soldered</text>
  <line x1="682" y1="540" x2="682" y2="650" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="694" y="600" fill="#22d3ee" font-size="10">I2C + 3.3V</text>

  <!-- IRRADIANCE -->
  <rect x="790" y="650" width="150" height="66" rx="6" fill="#16213a" stroke="#1e3354" stroke-width="1.5"/>
  <text x="865" y="674" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">IRRADIANCE</text>
  <text x="865" y="691" fill="#64748b" font-size="10" text-anchor="middle">sun-face flux</text>
  <text x="865" y="705" fill="#64748b" font-size="10" text-anchor="middle">I2C · power model</text>
  <line x1="820" y1="540" x2="820" y2="650" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="832" y="600" fill="#22d3ee" font-size="10">I2C</text>

  <!-- RTD SENSORS (external, to on-board MAX31865) -->
  <rect x="600" y="760" width="360" height="90" rx="8" fill="#111a2e" stroke="#1e3354" stroke-width="1.2"/>
  <text x="620" y="784" fill="#cbd5e1" font-size="12" font-weight="bold">6× PT1000 RTD  (one per face, external)</text>
  <text x="620" y="804" fill="#64748b" font-size="10">Each wires to its MAX31865 on the OBC board.</text>
  <text x="620" y="820" fill="#64748b" font-size="10">Sensitive measurement done on-board; robust RTD wiring makes the run to each face.</text>
  <text x="620" y="838" fill="#64748b" font-size="10">Radiator-face RTD routed clear of Geiger HV + UHF feed.</text>
  <line x1="780" y1="760" x2="780" y2="540" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="792" y="640" fill="#22d3ee" font-size="10">6× (RTD wire)</text>

  <!-- FOOTNOTES -->
  <text x="70" y="900" fill="#64748b" font-size="10">OPEN ITEMS (CubeADCS ICD): ① raw-IMU access (OBJ-7/8)  ② control interface + input-V range  ③ sun-sensor placement / keep-outs  ④ exact dimensions + power draw</text>
  <text x="70" y="916" fill="#64748b" font-size="10">UHF ICD: ⑤ input-V range  ⑥ JST-GH pinout  ·  CHANGES v Rev A: photodiode array dropped · payload sense board removed · single Geiger tube · STM32H753 confirmed · dual GNSS locked</text>
  <text x="70" y="948" fill="#334155" font-size="10">ThRACE-1-EBD-002 · Rev B · MAX31865 RTD interfaces shown in the separate OBC-internal diagram · all signal connectors JST-GH · power MiniFit Jr</text>
</svg>
